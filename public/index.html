<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="CarbonLens — Understand, track, and reduce your personal carbon footprint with AI-powered insights. Built for India." />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data:;
               connect-src 'self' https://generativelanguage.googleapis.com;" />

    <!-- Open Graph -->
    <meta property="og:title" content="CarbonLens — Carbon Footprint Awareness Platform" />
    <meta property="og:description" content="Track your carbon footprint, get personalised eco tips, and join community challenges." />
    <meta property="og:type" content="website" />

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>CarbonLens — Carbon Footprint Platform</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run CarbonLens.</noscript>
    <div id="root"></div>
  </body>
</html>
